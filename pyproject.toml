[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ebook-translator-mcp"
version = "0.1.0"
description = "MCP server that reads and writes the translation cache of the Calibre Ebook-Translator plugin"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["mcp>=1.2.0"]
keywords = ["mcp", "model-context-protocol", "calibre", "ebook-translator", "translation"]
classifiers = [
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Text Processing :: Linguistic",
]

[project.scripts]
ebook-translator-mcp = "ebook_translator_mcp:main"

[tool.setuptools]
py-modules = ["ebook_translator_mcp"]
